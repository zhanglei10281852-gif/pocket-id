rubrics:
  - id: 1
    type: f2p
    text: 令牌 actor 接受使用时会持久创建稳定且唯一的注册尝试，重复请求或多实例并发复用同一尝试时不会再次占用配额或创建竞争用户。
  - id: 2
    type: f2p
    text: 注册尝试与数据库提交的用户建立可恢复关联，正常成功时一个已消费名额恰好对应一个用户，并且完成状态可在重启后确认。
  - id: 3
    type: f2p
    text: 用户事务回滚或在提交前崩溃后，只归还该失败尝试占用的名额；其他并发成功尝试的 UsageCount 不会被错误递减。
  - id: 4
    type: f2p
    text: 用户已经提交但 actor 完成前进程退出时，重启恢复会识别现有用户并完成原尝试，不会归还配额、重复用户、审计或后续副作用。
  - id: 5
    type: f2p
    text: actor 不可用、令牌过期或撤销、数据库明确回滚和提交结果不确定具有可区分的状态与恢复动作，未完成尝试不会永久卡住令牌。
  - id: 6
    type: p2p
    text: 正常 token signup 仍创建既有默认组、custom claims、访问令牌和审计，并在数据库提交后至多调度一次 SCIM 同步。
  - id: 7
    type: p2p
    text: 开放注册、初始管理员注册、signup token 的 TTL、usage limit、列表和撤销接口保持现有行为，过期状态不会被恢复流程复活。
